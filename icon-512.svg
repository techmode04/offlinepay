<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.3"/>
  <g transform="translate(96, 96)">
    <!-- QR Corner Markers -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="none" stroke="url(#accent)" stroke-width="16"/>
    <rect x="26" y="26" width="48" height="48" rx="12" fill="url(#accent)"/>

    <rect x="220" y="0" width="100" height="100" rx="24" fill="none" stroke="url(#accent)" stroke-width="16"/>
    <rect x="246" y="26" width="48" height="48" rx="12" fill="url(#accent)"/>

    <rect x="0" y="220" width="100" height="100" rx="24" fill="none" stroke="url(#accent)" stroke-width="16"/>
    <rect x="26" y="246" width="48" height="48" rx="12" fill="url(#accent)"/>

    <!-- Lightning Offline Symbol -->
    <path d="M220 220 L180 320 L230 320 L200 400 L300 280 L250 280 Z" fill="#F59E0B" filter="url(#glow)"/>
  </g>
</svg>